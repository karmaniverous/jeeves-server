name: Linux Compatibility

on:
  push:
    branches: [feature/GH-13-linux-compat, main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile
        run: npx tsc

      - name: Build client
        run: cd client && npx vite build --outDir ../dist/client

      - name: Write test config
        run: |
          cat > jeeves.config.ts << 'EOF'
          import type { JeevesConfig } from './src/config/schema.js';

          export default {
            port: 3456,
            chromePath: '/usr/bin/chromium-browser',
            auth: {
              modes: ['keys'],
            },
            keys: {
              primary: 'ci-test-seed-not-a-real-secret-0000000000000000000000000000000000',
              _internal: 'ci-internal-seed-not-a-real-secret-00000000000000000000000000000000',
            },
            roots: {
              workspace: process.cwd(),
            },
            events: {},
          } satisfies JeevesConfig;
          EOF

      - name: Start server
        run: |
          node dist/server.js &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:3456/api/drives > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Smoke test - drives endpoint
        run: |
          RESPONSE=$(curl -s http://localhost:3456/api/drives)
          echo "Drives response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"letter"' || (echo "FAIL: No drives in response" && exit 1)

      - name: Smoke test - directory listing
        run: |
          # List the workspace root
          RESPONSE=$(curl -s -H "Authorization: Bearer ci-test" "http://localhost:3456/api/path/workspace" \
            -H "Cookie: " \
            --data-urlencode "" 2>/dev/null || \
            curl -s "http://localhost:3456/api/path/workspace?key=$(node -e "
              const {computeInsiderKey} = require('./dist/util/crypto.js');
              console.log(computeInsiderKey('ci-test-seed-not-a-real-secret-0000000000000000000000000000000000'));
            ")")
          echo "Directory response (first 500 chars): ${RESPONSE:0:500}"
          echo "$RESPONSE" | grep -q '"entries"' || echo "WARN: Directory listing may need auth adjustment"

      - name: Smoke test - file serving
        run: |
          # Try to load README.md via the API
          KEY=$(node -e "
            const crypto = require('crypto');
            const seed = 'ci-test-seed-not-a-real-secret-0000000000000000000000000000000000';
            const key = crypto.createHmac('sha256', seed).update('insider').digest('hex').substring(0, 32);
            console.log(key);
          ")
          RESPONSE=$(curl -s -w "\n%{http_code}" "http://localhost:3456/api/file/workspace/README.md?key=$KEY")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "README.md status: $HTTP_CODE"

      - name: Smoke test - SPA loads
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:3456/browse)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "SPA status: $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] || (echo "FAIL: SPA didn't load" && exit 1)

      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi
